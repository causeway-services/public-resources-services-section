<svg xmlns="http://www.w3.org/2000/svg" width="1620mm" height="790mm" viewBox="0 0 1620 790" role="img" aria-labelledby="title desc">
<title id="title">Transit Layer: open-front woven vest cut and seam model, ungraded sample</title>
<desc id="desc">Three original apparel pattern panels: full back and mirrored fronts, with 10 mm cut allowance, seam joins, vertical grain direction, scale square. This untested sample is not an accepted garment pattern.</desc>
